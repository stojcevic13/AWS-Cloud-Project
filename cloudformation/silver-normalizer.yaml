AWSTemplateFormatVersion: '2010-09-09'
Description: 'Silver layer - normalizes data from bronze to Parquet'

Parameters:
  BucketName:
    Type: String
    Description: Ime bucket-a
    Default: hn-bronze-300617413048-12345678

Resources:
  SilverLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}"
                  - !Sub "arn:aws:s3:::${BucketName}/*"

  SilverNormalizer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: silver-normalizer
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt SilverLambdaRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          BUCKET_NAME: !Ref BucketName
      Code:
        ZipFile: |
          import json
          import boto3
          import pandas as pd
          from datetime import datetime
          import re
          import os
          
          s3 = boto3.client('s3')
          BUCKET = os.environ['BUCKET_NAME']
          
          def clean_html(text):
              if not text:
                  return ""
              clean = re.sub(r'<[^>]+>', '', text)
              clean = re.sub(r'\s+', ' ', clean)
              return clean.strip()
          
          def convert_time(timestamp):
              return datetime.fromtimestamp(timestamp, datetime.UTC).isoformat() + 'Z'
          
          def lambda_handler(event, context):
              print("Počinjem normalizaciju...")
              
              prefix = "bronze/hackernews/"
              response = s3.list_objects_v2(Bucket=BUCKET, Prefix=prefix)
              
              if 'Contents' not in response:
                  return {'statusCode': 404, 'body': 'No data'}
              
              files = sorted(response['Contents'], key=lambda x: x['LastModified'], reverse=True)
              latest_file = files[0]['Key']
              
              obj = s3.get_object(Bucket=BUCKET, Key=latest_file)
              data = json.loads(obj['Body'].read())
              
              rows = []
              for item in data:
                  if not item or 'id' not in item:
                      continue
                  
                  rows.append({
                      'post_id': str(item.get('id')),
                      'author': item.get('by', 'unknown'),
                      'text': clean_html(item.get('text', '')),
                      'title': item.get('title', ''),
                      'score': item.get('score', 0),
                      'created_at': convert_time(item.get('time', 0)),
                      'type': item.get('type', 'unknown'),
                      'url': item.get('url', '')
                  })
              
              df = pd.DataFrame(rows)
              df = df.drop_duplicates(subset=['post_id'])
              
              output_file = '/tmp/posts.parquet'
              df.to_parquet(output_file, index=False)
              
              now = datetime.now(datetime.UTC)
              year = now.year
              month = now.month
              day = now.day
              
              s3_key = f"silver/posts/year={year}/month={month}/day={day}/posts.parquet"
              s3.upload_file(output_file, BUCKET, s3_key)
              
              return {
                  'statusCode': 200,
                  'body': json.dumps({'count': len(df), 'location': s3_key})
              }